<div class="profile-footer">
  <span>&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title | escape }}</span>
  <nav aria-label="Contact links">
    {% if site.author.email %}<a href="mailto:{{ site.author.email | escape }}">Email</a>{% endif %}
    {% if site.author.linkedin %}<a href="https://www.linkedin.com/in/{{ site.author.linkedin | escape }}/">LinkedIn</a>{% endif %}
    {% if site.author.github %}<a href="https://github.com/{{ site.author.github | escape }}">GitHub</a>{% endif %}
  </nav>
</div>
